<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src {{cspSource}} data:; style-src {{cspSource}} 'unsafe-inline'; script-src 'nonce-{{nonce}}';">
  <title>Remote Desktop</title>
  <link rel="stylesheet" href="{{styleUri}}">
  <link rel="stylesheet" href="{{terminalStyleUri}}">
</head>
<body>
  <header class="toolbar">
    <div class="brand"><strong id="accountName">正在读取账号…</strong></div>
    <time id="serverClock" class="server-clock" aria-label="服务器时间">服务器时间 —</time>
    <span class="connection" id="connection">正在连接…</span>
  </header>
  <div class="workspace">
    <aside class="dock" id="dock" aria-label="应用与窗口任务栏">
      <button id="newWindow" class="dock-action" title="新建资源管理器窗口" aria-label="新建资源管理器窗口">＋</button>
      <div id="pinnedApps" class="pinned-apps" aria-label="固定的应用"></div>
      <div id="windowTabs" class="window-tabs"></div>
    </aside>
    <main class="desktop" id="desktop" aria-label="远程桌面">
      <div class="desktop-caption"><span class="caption-icon" aria-hidden="true">▦</span><span id="desktopPath">桌面</span></div>
      <div id="icons" class="icons" aria-label="桌面文件"></div>
      <div id="windows"></div>
      <footer class="statusbar"><span class="operation-display" title="文件操作通过 VS Code 文件系统完成；这里显示对应的 Linux 指令"><span class="operation-label">等效命令</span><code id="operationCommand">—</code><span id="operationStatus"></span></span><span id="notice" role="status" aria-live="polite">正在读取桌面…</span><span id="cacheStatus"></span></footer>
    </main>
  </div>
  <template id="windowTemplate">
    <section class="window" aria-label="资源管理器窗口" tabindex="-1">
      <header class="titlebar"><span class="window-app-icon glyph folder" aria-hidden="true"></span><strong class="window-title">文件夹</strong><div class="window-controls" aria-label="窗口控件"><button type="button" class="window-control" data-window-action="minimize" aria-label="最小化" title="最小化">−</button><button type="button" class="window-control" data-window-action="maximize" aria-label="最大化" title="最大化">□</button><button type="button" class="window-control close" data-window-action="close" aria-label="关闭文件夹窗口" title="关闭">×</button></div></header>
      <div class="pathbar">
        <button data-window-action="back" aria-label="后退" title="后退">←</button>
        <button data-window-action="forward" aria-label="前进" title="前进">→</button>
        <button data-window-action="up" aria-label="上一级目录" title="上一级目录">↑</button>
        <button data-window-action="refresh" aria-label="刷新窗口" title="刷新窗口">↻</button>
        <div class="address-box"><input class="window-path" aria-label="目录地址" spellcheck="false" autocomplete="off" placeholder="输入目录地址，按 Enter 打开"></div>
        <button class="view-button" data-window-action="details" aria-label="详情视图" title="详情视图" aria-pressed="true">☷</button>
        <button class="view-button" data-window-action="icons" aria-label="图标视图" title="图标视图" aria-pressed="false">▦</button>
      </div>
      <div class="column-headings" aria-hidden="true"><span>名称</span><span>类型</span><span>大小</span></div>
      <div class="listing" aria-label="目录内容"></div>
      <footer class="window-footer"></footer>
    </section>
  </template>
  <template id="terminalTemplate">
    <section class="window terminal-window" aria-label="终端窗口" tabindex="-1">
      <header class="titlebar"><span class="terminal-app-icon" aria-hidden="true">&gt;_</span><strong class="window-title">终端</strong><div class="window-controls" aria-label="窗口控件"><button type="button" class="window-control" data-window-action="minimize" aria-label="最小化" title="最小化">−</button><button type="button" class="window-control" data-window-action="maximize" aria-label="最大化" title="最大化">□</button><button type="button" class="window-control close" data-window-action="close" aria-label="关闭终端窗口" title="关闭终端及其进程">×</button></div></header>
      <div class="terminal-commandbar">
        <span class="terminal-launch-label">新终端</span>
        <button data-terminal-program="shell" title="在新窗口启动 Shell">Shell</button>
        <button data-terminal-program="vim" title="在新窗口启动 Vim">Vim</button>
        <button data-terminal-program="htop" title="在新窗口启动 htop">htop</button>
      </div>
      <div class="terminal-location"></div>
      <div class="terminal-surface" aria-label="终端内容"></div>
      <footer class="window-footer terminal-status" role="status">正在启动终端…</footer>
    </section>
  </template>
  <div id="selectionBox" class="selection-box" hidden></div>
  <div id="dragGhost" class="drag-ghost" hidden></div>
  <div id="context" class="context" role="menu" aria-label="文件操作" hidden>
    <button data-action="open" role="menuitem">打开</button>
    <div class="menu-divider"></div>
    <button data-action="new-file" role="menuitem">新建文件</button>
    <button data-action="new-folder" role="menuitem">新建文件夹</button>
    <button data-action="rename" role="menuitem">重命名</button>
    <div class="menu-divider"></div>
    <button data-action="cut" role="menuitem">剪切</button>
    <button data-action="copy" role="menuitem">复制</button>
    <button data-action="paste" role="menuitem">粘贴</button>
    <button data-action="delete" role="menuitem">删除</button>
    <div class="menu-divider"></div>
    <button data-action="shortcut" role="menuitem">发送到桌面快捷方式</button>
    <button data-action="command-shortcut" role="menuitem">创建 VS Code 命令快捷方式</button>
    <button data-action="terminal" role="menuitem">在此处打开终端</button>
    <button data-action="refresh" role="menuitem">刷新</button>
    <button data-action="arrange" role="menuitem">整理桌面</button>
    <button data-action="fullscreen" role="menuitem" title="由 VS Code 切换全屏禅模式；再次选择或按两次 Esc 退出">切换全屏视图</button>
  </div>
  <div id="appContext" class="context" role="menu" aria-label="任务栏操作" hidden><button id="togglePinApp" role="menuitem">固定到任务栏</button><button id="unpinApp" role="menuitem">从任务栏取消固定</button></div>
  <script nonce="{{nonce}}" src="{{iconsUri}}"></script>
  <script nonce="{{nonce}}" src="{{terminalScriptUri}}"></script>
  <script nonce="{{nonce}}" src="{{terminalFitUri}}"></script>
  <script nonce="{{nonce}}" src="{{scriptUri}}"></script>
</body>
</html>
