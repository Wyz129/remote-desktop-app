<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; frame-src http://127.0.0.1:*; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>文档工作台</title><link rel="stylesheet" href="../media/workbench/katex.css"><link rel="stylesheet" href="workbench.css"></head>
<body>
<header><div class="brand">文档工作台</div><div id="filePath"></div><span id="readOnly" hidden>只读 · 无编辑权限</span><span id="dirty"></span></header>
<nav aria-label="文件操作"><button id="save">保存 Ctrl+S</button><button id="saveAs">另存为</button><button id="reload">重新载入</button><span class="divider"></span><label>语言 <select id="language"><option value="plaintext">纯文本</option><option value="python">Python</option><option value="cpp">C / C++</option><option value="fortran">Fortran</option><option value="html">HTML</option><option value="javascript">JavaScript</option><option value="css">CSS</option><option value="json">JSON</option><option value="markdown">Markdown</option><option value="shell">Shell</option></select></label><span id="htmlControls" hidden><button data-mode="source" class="selected">源码</button><button data-mode="split">分栏</button><button data-mode="preview">预览</button><button id="refreshPreview">刷新预览</button><button id="previewRoot">预览资源目录</button></span></nav>
<section id="notebookToolbar" hidden><button id="addCode">＋ 代码</button><button id="addMarkdown">＋ Markdown</button><button id="connectJupyter">连接 Jupyter</button><select id="kernelSpec" aria-label="内核类型" disabled></select><button id="startKernel" disabled>启动内核</button><select id="runningKernel" aria-label="已有内核" disabled></select><button id="attachKernel" disabled>连接内核</button><button id="interruptKernel" disabled>中断</button><button id="restartKernel" disabled>重启</button><button id="shutdownKernel" disabled>关闭内核</button><span id="kernelState">离线 · 可编辑已有内容</span></section>
<main id="workspace" data-mode="source"><div id="editor"></div><div id="notebook" hidden></div><section id="previewPanel" hidden><div class="preview-note">预览加载已保存的服务器文件。脚本在隔离环境运行。</div><iframe id="preview" sandbox="allow-scripts" referrerpolicy="no-referrer" title="HTML 隔离预览"></iframe></section></main>
<footer id="status" role="status">正在加载编辑器…</footer>
<dialog id="inputDialog"><form method="dialog" id="inputForm"><h2 id="inputTitle"></h2><p id="inputHelp"></p><label id="inputLabel" for="inputValue">路径</label><input id="inputValue" autocomplete="off" required><div id="tokenField" hidden><label for="jupyterToken">Jupyter Token（仅本次连接使用）</label><input id="jupyterToken" type="password" autocomplete="off"></div><div class="dialog-actions"><button type="button" id="inputCancel">取消</button><button type="submit">确定</button></div></form></dialog>
<script src="../media/workbench/marked.js"></script><script src="../media/workbench/purify.js"></script><script src="../media/workbench/katex.js"></script><script src="../media/workbench/auto-render.js"></script><script src="../media/workbench/vs/loader.js"></script><script src="workbench.js"></script>
</body></html>
